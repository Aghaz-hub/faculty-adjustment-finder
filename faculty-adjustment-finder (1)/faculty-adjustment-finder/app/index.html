<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Science & Engineering | Adjustment Finder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Computer Science &amp; Engineering ; Adjustment Finder</h1>
      <p class="subtitle">Find a free faculty member to cover a lecture, period by period.</p>
      <p class="developer">Developer : Agha Imran Husain</p>
    </div>
  </header>

  <main class="wrap">
    <section class="picker card">
      <div class="field">
        <label for="day-select">Day</label>
        <select id="day-select"></select>
      </div>
      <div class="field">
        <label for="period-select">Period</label>
        <select id="period-select"></select>
      </div>
      <div class="field">
        <label for="dept-filter">Filter by keyword <span class="hint">(department, subject...)</span></label>
        <input id="dept-filter" type="text" placeholder="e.g. CST, AIML, Java">
      </div>
    </section>

    <section class="results">
      <div class="results-header">
        <h2 id="results-title">Select a day and period</h2>
        <span id="results-count" class="count-pill"></span>
      </div>
      <div id="results-list" class="faculty-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p class="visitor-count">Visitors: <span id="visit-count">…</span></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
